[project]
name = "servicenow-workflow-demo"
version = "1.0.0"
description = "ServiceNow-concepts incident workflow and SLA timer simulation"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["servicenow_demo*"]
